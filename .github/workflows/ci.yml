name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movieshelf_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      NODE_ENV: test
      PORT: 5000

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshelf_test

      JWT_SECRET: ci-test-jwt-secret-movieshelf-at-least-32-characters
      JWT_EXPIRES_IN: 7d

      TMDB_API_KEY: ci-test-tmdb-api-key
      TMDB_BASE_URL: https://api.themoviedb.org/3

      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

      EMAIL_HOST: localhost
      EMAIL_PORT: 587
      EMAIL_SECURE: "false"
      EMAIL_USER: ci-test-user
      EMAIL_PASS: ci-test-password
      EMAIL_FROM: "MovieShelf <noreply@example.com>"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Generate Prisma Client
        run: npm run db:generate


      - name: Run all tests
        run: npm run test:all


      - name: Security audit
        run: npm audit