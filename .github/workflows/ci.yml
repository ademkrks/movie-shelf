name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movieshelf_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      NODE_ENV: test
      PORT: 5000

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movieshelf_test

      JWT_SECRET: ci-test-jwt-secret-movieshelf-at-least-32-characters
      JWT_EXPIRES_IN: 7d

      TMDB_API_KEY: ci-test-tmdb-api-key
      TMDB_BASE_URL: https://api.themoviedb.org/3

      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

      EMAIL_HOST: localhost
      EMAIL_PORT: 587
      EMAIL_SECURE: "false"
      EMAIL_USER: ci-test-user
      EMAIL_PASS: ci-test-password
      EMAIL_FROM: "MovieShelf <noreply@example.com>"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json


      - name: Install backend dependencies
        run: npm ci


      - name: Generate Prisma Client
        run: npm run db:generate


      - name: Run backend test suite
        run: npm run test:all


      - name: Security audit report
        run: npm audit
        continue-on-error: true


      - name: Block critical vulnerabilities
        run: npm audit --audit-level=critical


  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Run ESLint
        working-directory: frontend
        run: npm run lint


      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.movieshelf.example
        run: npm run build


  mobile:
    name: Mobile Checks
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: mobile/package-lock.json


      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci


      - name: Run mobile quality checks
        working-directory: mobile
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: npm run check